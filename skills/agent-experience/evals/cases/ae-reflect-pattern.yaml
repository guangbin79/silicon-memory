      ---

      # FTS5 特殊字符崩溃

      ## Symptom
      - fts5 syntax error（含 - 与 * 的输入）

      ## Root Cause
      - 特殊字符未转义直接进 MATCH

      ## Fix
      - 输入侧统一 sanitize 后再查询

      Evidence: E1（CI 复验通过）
